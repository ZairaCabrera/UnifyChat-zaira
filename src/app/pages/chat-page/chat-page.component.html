<ion-header>
  <div class="header-chat">
    <ion-toolbar>
      <div class="logo-chat">
        <ion-buttons slot="start">
          <img src="assets/icon/logo-UnifyChat.png" alt="Logo" class="header-logo" />
        </ion-buttons>
      </div>

      <ion-title></ion-title>

      <div class="button-chat">
        <button (click)="toggleMenu()">
          <svg clip-rule="evenodd" fill-rule="evenodd" stroke-linejoin="round" stroke-miterlimit="2" viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg">
            <path
              d="m12 16.495c1.242 0 2.25 1.008 2.25 2.25s-1.008 2.25-2.25 2.25-2.25-1.008-2.25-2.25 1.008-2.25 2.25-2.25zm0-6.75c1.242 0 2.25 1.008 2.25 2.25s-1.008 2.25-2.25 2.25-2.25-1.008-2.25-2.25 1.008-2.25 2.25-2.25zm0-6.75c1.242 0 2.25 1.008 2.25 2.25s-1.008 2.25-2.25 2.25-2.25-1.008-2.25-2.25 1.008-2.25 2.25-2.25z" />
          </svg>
        </button>

        <div class="menu">
          @if (showMenu()) {
          <button (click)="clearMessages()">
            <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg" fill-rule="evenodd"
              clip-rule="evenodd">
              <path
                d="M9 3h6v-1.75c0-.066-.026-.13-.073-.177-.047-.047-.111-.073-.177-.073h-5.5c-.066 0-.13.026-.177.073-.047.047-.073.111-.073.177v1.75zm11 1h-16v18c0 .552.448 1 1 1h14c.552 0 1-.448 1-1v-18zm-10 3.5c0-.276-.224-.5-.5-.5s-.5.224-.5.5v12c0 .276.224.5.5.5s.5-.224.5-.5v-12zm5 0c0-.276-.224-.5-.5-.5s-.5.224-.5.5v12c0 .276.224.5.5.5s.5-.224.5-.5v-12zm8-4.5v1h-2v18c0 1.105-.895 2-2 2h-14c-1.105 0-2-.895-2-2v-18h-2v-1h7v-2c0-.552.448-1 1-1h6c.552 0 1 .448 1 1v2h7z" />
            </svg>
            Borrar chat
          </button>

          <button (click)="logout()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path
                d="M10 9.408l2.963 2.592-2.963 2.592v-1.592h-8v-2h8v-1.592zm-2-4.408v4h-8v6h8v4l8-7-8-7zm6-3c-1.787 0-3.46.474-4.911 1.295l.228.2 1.396 1.221c1.004-.456 2.114-.716 3.287-.716 4.411 0 8 3.589 8 8s-3.589 8-8 8c-1.173 0-2.283-.26-3.288-.715l-1.396 1.221-.228.2c1.452.82 3.125 1.294 4.912 1.294 5.522 0 10-4.477 10-10s-4.478-10-10-10z" />
            </svg>
            Salir
          </button>
          }
        </div>
      </div>
    </ion-toolbar>
  </div>
</ion-header>


<ion-content #content class="chat-content">
  <!-- position="top", invierte el scroll para cargar desde arriba -->
   @if (messages().length >= pageSize) {
      @if (hasMore) {
  <ion-infinite-scroll
      #inf
      position="top"
      threshold="80px"
      (ionInfinite)="getMoreMessage($event)">

    <ion-infinite-scroll-content loadingSpinner="dots" loadingText="Cargando mensajes anteriores...">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>
      }
    }
  <div class="chat-list">
    <ng-container>
      @for (msg of messages(); track msg.id) {
      <div class="chat-item" [class.own]="msg.from === (currentUser | async)?.uid">
        <!-- avatar -->

        @if (msg.avatar) {
          <img [src]="msg.avatar" alt="avatar" class="chat-avatar" />
        }
        <!-- burbuja de mensaje -->
        <div class="message-bubble">
          <div class="bubble-content">
            <p>{{ msg.text }}</p>
            <span class="timestamp">{{ msg.ts | date:'shortTime' }}</span>
          </div>

          <!-- borramos chat -->
          <button class="delete-single" (click)="deleteMessage(msg.id)">
            <svg viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet" width="24" height="24"
              xmlns="http://www.w3.org/2000/svg" fill-rule="evenodd" clip-rule="evenodd">
              <path
                d="M9 3h6v-1.75c0-.066-.026-.13-.073-.177-.047-.047-.111-.073-.177-.073h-5.5c-.066 0-.13.026-.177.073-.047.047-.073.111-.073.177v1.75zm11 1h-16v18c0 .552.448 1 1 1h14c.552 0 1-.448 1-1v-18zm-10 3.5c0-.276-.224-.5-.5-.5s-.5.224-.5.5v12c0 .276.224.5.5.5s.5-.224.5-.5v-12zm5 0c0-.276-.224-.5-.5-.5s-.5.224-.5.5v12c0 .276.224.5.5.5s.5-.224.5-.5v-12zm8-4.5v1h-2v18c0 1.105-.895 2-2 2h-14c-1.105 0-2-.895-2-2v-18h-2v-1h7v-2c0-.552.448-1 1-1h6c.552 0 1 .448 1 1v2h7z" />
            </svg>
          </button>
        </div>

      </div>
      }
    </ng-container>
  </div>
</ion-content>


<ion-footer>
  <div class="chat-footer-native">
    <ion-toolbar>
      <div class="footer-inner-native">
        <form [formGroup]="messageForm" (ngSubmit)="onSubmit()">

          <input formControlName="message" placeholder="Escribe un mensaje" class="input-message-native" />

          <button type="submit" [disabled]="messageForm.get('message')?.invalid" class="btn-message-native">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M2.01 21l20.99-9L2.01 3v7l15 2-15 2z" />
            </svg>
          </button>

        </form>
      </div>
    </ion-toolbar>
  </div>
</ion-footer>
